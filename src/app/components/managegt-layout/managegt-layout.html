<div class="gtadmin-shell">

  <!-- Mobile Topbar -->
  <header class="gtadmin-topbar" *ngIf="isLoggedIn">
    <div class="topbar-left">
      <button class="topbar-menu-btn" (click)="toggleMobileMenu()" aria-label="Toggle Menu">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
      </button>
      <img src="/ganatubenewlogo.png" alt="GanaTube Admin" class="topbar-logo" />
      <span class="topbar-title">Admin Panel</span>
    </div>
    <button class="topbar-user" (click)="logout()" title="Sign Out">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
      <span>Logout</span>
    </button>
  </header>

  <!-- Mobile Sidebar Overlay -->
  <div class="gtadmin-overlay" *ngIf="isLoggedIn && isMobileMenuOpen" (click)="closeMobileMenu()"></div>

  <!-- Sidebar -->
  <aside class="gtadmin-sidebar" *ngIf="isLoggedIn" [class.open]="isMobileMenuOpen">

    <div class="sidebar-brand">
      <img src="/ganatubenewlogo.png" alt="GanaTube Admin" class="brand-logo" />
      <div class="brand-text">
        <span class="brand-name">GanaTube</span>
        <span class="brand-sub">Admin Panel</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <div class="sidebar-group" *ngFor="let group of groups; trackBy: trackByGroup">

        <!-- Group with multiple links → collapsible dropdown -->
        <ng-container *ngIf="group.links.length > 1; else singleLink">
          <button class="group-toggle" [class.active]="isGroupActive(group)" (click)="toggleGroup(group.key)">
            <span class="group-icon" [ngSwitch]="group.key">
              <svg *ngSwitchCase="'content'" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></svg>
              <svg *ngSwitchCase="'promotion'" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg>
              <svg *ngSwitchCase="'rooms'" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2"/><path d="M16.24 7.76a6 6 0 0 1 0 8.49"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
              <svg *ngSwitchDefault viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
            </span>
            <span class="group-label">{{ group.label }}</span>
            <svg class="chevron" [class.open]="openGroups[group.key]" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 18 18 9"/></svg>
          </button>

          <div class="group-links" *ngIf="openGroups[group.key]">
            <a *ngFor="let link of group.links"
               [routerLink]="link.path"
               (click)="closeMobileMenu()"
               routerLinkActive="active"
               class="group-link">
              <span class="link-dot"></span>
              {{ link.label }}
            </a>
          </div>
        </ng-container>

        <!-- Single link group → direct item -->
        <ng-template #singleLink>
          <a *ngFor="let link of group.links"
             [routerLink]="link.path"
             (click)="closeMobileMenu()"
             routerLinkActive="active"
             class="group-toggle direct"
             [class.active]="isGroupActive(group)">
            <span class="group-icon" [ngSwitch]="group.key">
              <svg *ngSwitchCase="'rooms'" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2"/><path d="M16.24 7.76a6 6 0 0 1 0 8.49"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
              <svg *ngSwitchDefault viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
            </span>
            <span class="group-label">{{ link.label }}</span>
          </a>
        </ng-template>

      </div>
    </nav>

    <div class="sidebar-footer">
      <button class="sidebar-logout" (click)="logout()">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        Sign Out
      </button>
    </div>

  </aside>

  <!-- Main Content -->
  <main class="gtadmin-main">
    <router-outlet></router-outlet>
  </main>

</div>
