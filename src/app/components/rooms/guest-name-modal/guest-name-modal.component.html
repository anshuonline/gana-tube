<div class="modal-overlay" (click)="closeModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>Join as Guest</h2>
      <button class="btn-close" (click)="closeModal()" aria-label="Close">
        <svg lucideX [attr.size]="20"></svg>
      </button>
    </div>

    <div class="modal-body">
      <div class="icon-container">
        <svg lucideUser [attr.size]="32"></svg>
      </div>

      <p class="description">Please enter a display name to join the room.</p>

      <div class="form-group">
        <label for="guestName">Display Name</label>
        <div class="input-wrapper">
          <input
            type="text"
            id="guestName"
            [(ngModel)]="guestName"
            placeholder="Enter your name"
            (keyup.enter)="submit()"
            maxlength="20"
            autocomplete="off"
            autofocus>
          <span class="char-count">{{ guestName.length }}/20</span>
        </div>
      </div>

      <div class="error-msg" *ngIf="error">{{error}}</div>
    </div>

    <div class="modal-footer">
      <button class="btn-primary" (click)="submit()" [disabled]="!guestName.trim()">
        Continue to Room
      </button>
    </div>

    <div class="login-hint">
      Or <a href="/profile">login with Google</a> to save your liked songs.
    </div>
  </div>
</div>
