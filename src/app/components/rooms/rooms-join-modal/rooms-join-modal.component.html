<div class="modal-backdrop" (click)="closeModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>Join Room</h2>
      <button class="btn-close" (click)="closeModal()">
        <svg lucideX [attr.size]="20"></svg>
      </button>
    </div>

    <div class="modal-body">
      <div class="icon-container">
        <svg lucideKey [attr.size]="48"></svg>
      </div>
      
      <p class="description">Enter the 6-character Room Code shared by the host to join their listening session.</p>

      <div class="form-group">
        <label for="roomCode">Room Code</label>
        <input 
          type="text" 
          id="roomCode" 
          [(ngModel)]="roomCode" 
          maxlength="6"
          placeholder="e.g. A1B2C3"
          autocomplete="off"
          (keyup.enter)="joinRoom()"
          style="text-transform: uppercase;">
      </div>

      <div class="error-msg" *ngIf="error">
        {{error}}
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn-cancel" (click)="closeModal()">Cancel</button>
      <button class="btn-primary" (click)="joinRoom()" [disabled]="!roomCode.trim()">
        Join Room
      </button>
    </div>
  </div>
</div>
