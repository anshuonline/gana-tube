<div class="modal-backdrop" (click)="closeModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>Create a Listening Room</h2>
      <button class="btn-close" (click)="closeModal()">
        <svg lucideX [attr.size]="20"></svg>
      </button>
    </div>

    <div class="modal-body">
      <div class="form-group">
        <label for="roomName">Room Name</label>
        <input 
          type="text" 
          id="roomName" 
          [(ngModel)]="roomName" 
          maxlength="40"
          placeholder="e.g. Late Night Vibes"
          autocomplete="off">
      </div>

      <div class="visibility-options">
        <label class="visibility-option" [class.active]="isPublic">
          <input type="radio" name="visibility" [value]="true" [(ngModel)]="isPublic">
          <div class="option-content">
            <svg lucideGlobe [attr.size]="24" class="icon-globe"></svg>
            <div class="text">
              <h4>Public Room</h4>
              <p>Anyone can see and join this room.</p>
            </div>
          </div>
        </label>

        <label class="visibility-option" [class.active]="!isPublic">
          <input type="radio" name="visibility" [value]="false" [(ngModel)]="isPublic">
          <div class="option-content">
            <svg lucideLock [attr.size]="24" class="icon-lock"></svg>
            <div class="text">
              <h4>Private Room</h4>
              <p>Only people with the invite code can join.</p>
            </div>
          </div>
        </label>
      </div>

      <div class="info-note" *ngIf="!isPublic">
        <p>A join code will be generated automatically after you create the room.</p>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn-cancel" (click)="closeModal()">Cancel</button>
      <button class="btn-primary" (click)="createRoom()" [disabled]="!roomName.trim()">
        Create Room
      </button>
    </div>
  </div>
</div>
