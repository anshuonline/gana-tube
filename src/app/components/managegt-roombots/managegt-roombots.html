<div class="rb-page">

  <header class="rb-header">
    <div class="header-content">
      <h2>Manage RoomBots</h2>
      <p>Map each bot room to a specific YouTube Playlist ID. Bots auto-play from their mapped playlist.</p>
    </div>
    <div class="header-actions">
      <button class="action-btn secondary" (click)="fetchConfig()" [disabled]="isFetching">
        <svg lucideRefreshCw class="spin-anim" [class.spinning]="isFetching" [attr.size]="15"></svg>
        {{ isFetching ? 'Refreshing...' : 'Refresh' }}
      </button>
      <button class="action-btn primary" (click)="saveConfig()" [disabled]="isPublishing">
        <svg lucideSave [attr.size]="15"></svg>
        {{ isPublishing ? 'Saving...' : 'Save Config' }}
      </button>
    </div>
  </header>

  <div class="rb-message" *ngIf="publishMessage" [class.success]="publishMessage === 'Saved successfully!'" [class.error]="publishMessage !== 'Saved successfully!'">
    {{ publishMessage }}
  </div>

  <div class="rb-grid">
    <div class="rb-card" *ngFor="let id of roomPlaylists; let i = index; trackBy: trackByIndex">
      <div class="rb-card-head">
        <span class="bot-num">{{ i + 1 }}</span>
        <h3>Bot Room {{ i + 1 }}</h3>
      </div>
      <label class="rb-label">YouTube Playlist ID</label>
      <input type="text" [(ngModel)]="roomPlaylists[i]"
             placeholder="e.g. PLx0sYbCqOb8TBPRdmBHs5Iftvv9TPboYG"
             class="rb-input" />
    </div>
  </div>

</div>
