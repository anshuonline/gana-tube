<div class="shorts-container">
  <!-- Desktop 9:16 Wrapper -->
  <div class="desktop-wrapper" #shortsContainer (scroll)="onScroll($event)">
  <!-- Hidden YouTube players for Dual-Iframe Engine -->
  <div class="hidden-players">
    <div id="shorts-player-a"></div>
    <div id="shorts-player-b"></div>
  </div>

  <!-- Top Nav (Fixed globally) -->
  <div class="shorts-header fixed-header">
    <div class="header-left">
      <button class="icon-btn back-btn" (click)="goBack()">
        <svg lucideChevronLeft [attr.size]="28"></svg>
      </button>
      <span class="header-title">Shorts</span>
    </div>
    <div class="header-right" *ngIf="queue().length > 0">
      <button class="full-song-pill" [class.active]="isFullSongMode()" (click)="toggleFullSongMode(); $event.stopPropagation()">
        <svg lucidePlay [attr.size]="14" fill="currentColor"></svg>
        {{ isFullSongMode() ? 'Full Song: ON' : 'Full Song: OFF' }}
      </button>
    </div>
  </div>

  <!-- Initial full-page loading -->
  <div class="loading-overlay" *ngIf="isLoading() && queue().length === 0">
    <div class="spinner"></div>
    <p>Loading...</p>
  </div>

  <!-- Buffering overlay (when user scrolls fast or song is loading) -->
  <div class="buffering-indicator" *ngIf="isBuffering() && !isLoading()">
    <div class="buffering-spinner"></div>
  </div>

  <div class="floating-heart" *ngFor="let heart of floatingHearts()" 
       [style.left.px]="heart.x" [style.top.px]="heart.y">
    <svg lucideHeart [attr.size]="160" [attr.width]="160" [attr.height]="160" color="url(#heart-gradient)" fill="url(#heart-gradient)"></svg>
  </div>

  <!-- SVG Definition for gradient -->
  <svg width="0" height="0" class="svg-defs">
    <defs>
      <linearGradient id="heart-gradient" x1="0%" y1="100%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#ff0055" />
        <stop offset="100%" stop-color="#ff5e00" />
      </linearGradient>
    </defs>
  </svg>

  <div class="short-slide" *ngFor="let item of queue(); let i = index" (click)="handleTap($event, item)">
    <!-- Immersive Background -->
    <div class="bg-blur" [style.backgroundImage]="'url(' + item.thumbnailHigh + ')'"></div>
    <div class="bg-overlay"></div>

    <!-- Center Content (Spinning CD) -->
    <div class="center-content">
      <div class="spinning-cd" [class.paused]="i !== currentIndex()">
        <img [src]="item.thumbnailHigh" alt="cover" loading="lazy">
      </div>
    </div>

    <!-- Bottom Info -->
    <div class="bottom-info">
      <h2 class="title">{{ item.title }}</h2>
      <p class="artist">
        <svg lucideMusic [attr.size]="14"></svg> {{ item.channelTitle }}
      </p>
    </div>

    <!-- Right Side Actions -->
    <div class="action-sidebar">
      <!-- Like -->
      <button class="action-btn" (click)="likeTrack(item); $event.stopPropagation()">
        <svg lucideHeart [attr.size]="30" [color]="item.isLiked ? '#ff0000' : '#fff'" [attr.fill]="item.isLiked ? '#ff0000' : 'none'"></svg>
        <span>Like</span>
      </button>
      

      <!-- Share -->
      <button class="action-btn" (click)="shareTrack(item); $event.stopPropagation()">
        <svg lucideShare2 [attr.size]="30" color="#fff"></svg>
        <span>Share</span>
      </button>
      
      <!-- More -->
      <button class="action-btn" (click)="$event.stopPropagation()">
        <svg lucideMoreVertical [attr.size]="30" color="#fff"></svg>
      </button>
      
      <!-- Animated Equalizer Icon (when playing) -->
      <div class="playing-eq" *ngIf="i === currentIndex() && !isBuffering()">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
      </div>
    </div>
  </div>
  
  </div> <!-- end desktop wrapper -->
</div>
