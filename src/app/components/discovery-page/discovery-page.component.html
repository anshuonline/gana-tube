<div class="discovery-page-wrapper">
  
  <div class="discovery-main">
    
    <!-- Hero Section -->
    <div class="discovery-hero">
      
      <!-- Loading Skeleton -->
      <div class="hero-skeleton" *ngIf="isHeroLoading">
        <div class="skeleton-bg skeleton-pulse"></div>
      </div>
      
      <div class="hero-carousel" *ngIf="!isHeroLoading" 
           [style.transform]="'translateX(-' + currentHeroIndex * 100 + '%)'"
           (touchstart)="onTouchStart($event)" 
           (touchend)="onTouchEnd($event)">
        <div class="hero-slide" *ngFor="let hero of heroItems; let i = index">
          <img [src]="hero.thumbnailHigh || hero.thumbnail" alt="hero image" class="hero-bg" />
          <div class="hero-glass-overlay"></div>
          
          <div class="hero-content-wrapper">
            <div class="hero-thumb-glass" (click)="onPlay(hero)">
              <img [src]="hero.thumbnailHigh || hero.thumbnail" [alt]="hero.title" />
              <div class="play-glass-btn">
                <svg lucidePlay [attr.size]="36" [attr.fill]="'currentColor'"></svg>
              </div>
            </div>
            
            <div class="hero-text-glass">
              <span class="genz-badge">TRENDING NOW</span>
              <h2 [title]="hero.title">{{ hero.title }}</h2>
              <p>
                <svg lucideMusic [attr.size]="14"></svg>
                {{ hero.channelTitle }}
              </p>
            </div>
          </div>
        </div>
      </div>
      
      <!-- Controls -->
      <button class="hero-nav prev" *ngIf="!isHeroLoading && heroItems.length > 1" (click)="prevHero()">
        <svg lucideChevronLeft></svg>
      </button>
      <button class="hero-nav next" *ngIf="!isHeroLoading && heroItems.length > 1" (click)="nextHero()">
        <svg lucideChevronRight></svg>
      </button>
      
      <!-- Dots -->
      <div class="hero-dots" *ngIf="!isHeroLoading && heroItems.length > 1">
        <span class="dot" *ngFor="let hero of heroItems; let i = index" [class.active]="currentHeroIndex === i" (click)="currentHeroIndex = i"></span>
      </div>
    </div>

    <!-- Video Feed -->
    <div class="discovery-feed">
      <!-- Loading State -->
      <div class="loading-state" *ngIf="isSearching">
        <div class="spinner"></div>
        <p>{{ loadingMessage }}</p>
      </div>
      
      <!-- Error State -->
      <div class="error-state" *ngIf="errorMessage">
        <p>{{ errorMessage }}</p>
      </div>

      <!-- Results Feed (YouTube Style) -->
      <div class="feed-grid" *ngIf="results.length > 0 && !isSearching">
        <div class="video-card" *ngFor="let track of results" (click)="onPlay(track)" (contextmenu)="onRightClick($event, track)">
          <div class="thumbnail-wrapper">
            <img [src]="track.thumbnailHigh || track.thumbnail" [alt]="track.title" loading="lazy" />
            <div class="play-overlay">
              <svg lucidePlay [attr.size]="48" [attr.fill]="'currentColor'"></svg>
            </div>
            <div class="playing-indicator" *ngIf="isCurrentTrack(track)">
               <div class="bar"></div><div class="bar"></div><div class="bar"></div>
            </div>

          </div>
          <div class="video-info">
            <h3 class="title" [title]="track.title">{{ track.title }}</h3>
            <p class="channel">
              <svg lucideMusic [attr.size]="14"></svg>
              {{ track.channelTitle }}
            </p>
          </div>
        </div>
      </div>

      <!-- Scroll loader -->
      <div class="scroll-loader" *ngIf="loadingMore">
         <div class="spinner-small"></div>
      </div>
    </div>
  </div>

  <!-- Floating Aura Chat Bubble -->
  <div class="aura-container" [class.minimized]="isAuraMinimized" [class.has-player]="playerService.currentTrack() !== null">
    
    <!-- Collapsed FAB -->
    <button class="aura-fab" *ngIf="isAuraMinimized" (click)="toggleAura()">
      <svg lucideSparkles [attr.size]="24"></svg>
    </button>

    <!-- Expanded Chat Window -->
    <div class="ask-panel" *ngIf="!isAuraMinimized">
      <div class="ask-header">
        <div class="header-left">
          <svg lucideSparkles [attr.size]="20" class="ask-icon"></svg>
          <h3>Aura</h3>
        </div>
        <button class="minimize-btn" (click)="toggleAura()">
          <svg lucideMinus [attr.size]="20"></svg>
        </button>
      </div>
      
      <div class="ask-body">
        <p>Tell me what you're in the mood for. I'll curate the perfect mix instantly.</p>
        <div class="prompt-examples">
          <button (click)="askQuery = 'Anuv Jain & Prateek Kuhad vibe'; askAI()">"Anuv Jain & Prateek Kuhad vibe"</button>
          <button (click)="askQuery = 'Late night driving mix'; askAI()">"Late night driving mix"</button>
          <button (click)="askQuery = 'English Hindi Gen Z mix'; askAI()">"English Hindi Gen Z mix"</button>
        </div>
      </div>
      
      <div class="ask-input-area">
        <textarea 
          [(ngModel)]="askQuery" 
          placeholder="E.g., Arijit Singh romantic hits..."
          (keyup.enter)="$event.preventDefault(); askAI()"
          rows="2"
        ></textarea>
        <button class="send-btn" (click)="askAI()" [disabled]="isSearching || !askQuery.trim()">
          <span *ngIf="!isSearching">Curate</span>
          <div class="spinner-small" *ngIf="isSearching"></div>
        </button>
      </div>
    </div>
  </div>

</div>
