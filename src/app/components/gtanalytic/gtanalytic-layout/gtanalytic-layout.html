<div class="gtanalytic-shell">

  <!-- Topbar Header -->
  <header class="gtanalytic-topbar">
    <div class="topbar-left">
      <button class="menu-toggle-btn" (click)="toggleMobileMenu()" aria-label="Toggle navigation">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>

      <div class="topbar-brand" routerLink="/gtanalytic/overview">
        <img src="/ganatubenewlogo.png" alt="GanaTube" class="brand-logo" />
        <div class="brand-titles">
          <span class="brand-name">GanaTube</span>
          <span class="brand-tag">Analytics</span>
        </div>
      </div>

      <!-- Quick Section Dropdown Menu (For Mobile & Fast Switch) -->
      <div class="quick-nav-dropdown-wrapper">
        <svg class="dropdown-icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        <select 
          class="quick-nav-select" 
          [ngModel]="selectedNavPath" 
          (ngModelChange)="onNavDropdownChange($event)">
          <option *ngFor="let item of navItems" [value]="item.path">
            {{ item.label }} {{ item.badge ? '(' + item.badge + ')' : '' }}
          </option>
        </select>
      </div>
    </div>

    <div class="topbar-right">
      <!-- Time Filter Dropdown -->
      <div class="filter-dropdown-wrapper">
        <svg class="filter-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <select 
          class="filter-select"
          [ngModel]="dataService.currentFilter()"
          (ngModelChange)="onTimeFilterChange($event)">
          <option *ngFor="let tf of timeFilters" [value]="tf.id">{{ tf.label }}</option>
        </select>
      </div>

      <!-- Refresh Action -->
      <button class="btn-action-icon" (click)="refreshData()" [class.loading]="dataService.loading()" title="Refresh Analytics">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      </button>

      <!-- Logout -->
      <button class="btn-logout" (click)="logout()" title="Sign Out">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span class="logout-text">Logout</span>
      </button>
    </div>
  </header>

  <!-- Mobile Overlay -->
  <div class="mobile-overlay" *ngIf="isMobileMenuOpen" (click)="closeMobileMenu()"></div>

  <!-- Layout Body -->
  <div class="gtanalytic-body">
    
    <!-- Sidebar Navigation -->
    <aside class="gtanalytic-sidebar" [class.open]="isMobileMenuOpen">
      <div class="sidebar-header-mobile">
        <span class="mobile-menu-title">Analytics Navigation</span>
        <button class="btn-close-mobile" (click)="closeMobileMenu()">&times;</button>
      </div>

      <nav class="sidebar-nav">
        <a 
          *ngFor="let item of navItems" 
          [routerLink]="item.path" 
          (click)="closeMobileMenu()"
          routerLinkActive="active" 
          class="nav-item">
          
          <span class="nav-icon" [ngSwitch]="item.icon">
            <svg *ngSwitchCase="'dashboard'" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
            <svg *ngSwitchCase="'activity'" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
            <svg *ngSwitchCase="'users-guest'" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            <svg *ngSwitchCase="'user-check'" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><polyline points="16 11 18 13 22 9"/></svg>
            <svg *ngSwitchCase="'radio'" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="2"/><path d="M16.24 7.76a6 6 0 0 1 0 8.49"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
            <svg *ngSwitchDefault viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          </span>

          <span class="nav-label">{{ item.label }}</span>
          <span *ngIf="item.badge" class="nav-badge">{{ item.badge }}</span>
        </a>
      </nav>

      <div class="sidebar-status-card">
        <div class="status-indicator">
          <span class="pulse-dot"></span>
          <span class="status-text">Live Sync Active</span>
        </div>
        <p class="status-time">Updated: {{ dataService.lastUpdated() | date:'shortTime' }}</p>
      </div>
    </aside>

    <!-- Main Router Outlet Page Container -->
    <main class="gtanalytic-content">
      <router-outlet></router-outlet>
    </main>

  </div>

</div>
