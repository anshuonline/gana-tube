<div class="modal-overlay" (click)="closeModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    
    <!-- Ambient Gradient Glow Orbs -->
    <div class="ambient-glow glow-top-left"></div>
    <div class="ambient-glow glow-bottom-right"></div>

    <!-- Header Section -->
    <div class="modal-header">
      <div class="header-left">
        <div class="icon-orb">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10z"></path>
            <line x1="2" y1="12" x2="22" y2="12"></line>
          </svg>
        </div>
        <div class="header-text">
          <h2 class="modal-title">
            <span>What do you listen to?</span>
            <span class="sparkle-emoji">✨</span>
          </h2>
          <p class="modal-subtitle">Choose one or more languages for personalized songs & playlists</p>
        </div>
      </div>

      <button class="btn-close" (click)="closeModal()" aria-label="Close" title="Close">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <!-- Toolbar / Selection Count & Quick Actions -->
    <div class="selection-toolbar">
      <div class="counter-badge">
        <span class="pulse-dot"></span>
        <span class="count-text"><b>{{ selectedLanguages().length }}</b> Selected</span>
      </div>

      <div class="toolbar-actions">
        <button type="button" class="btn-text-action" (click)="selectAll()">
          Select All
        </button>
        <span class="action-divider">·</span>
        <button type="button" class="btn-text-action" (click)="resetToDefaults()">
          Reset
        </button>
      </div>
    </div>

    <!-- Languages Grid -->
    <div class="languages-scroll-area">
      <div class="languages-grid">
        <button
          type="button"
          *ngFor="let lang of languages"
          class="language-card"
          [class.active]="isSelected(lang.code)"
          (click)="toggleLanguage(lang.code)">
          
          <div class="card-left">
            <div class="checkbox-indicator">
              <svg *ngIf="isSelected(lang.code)" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            </div>
            <div class="card-titles">
              <div class="native-row">
                <span class="native-name">{{ lang.native }}</span>
                <span *ngIf="lang.badge" class="lang-badge" [class.trending]="lang.badge === 'Trending'">{{ lang.badge }}</span>
              </div>
              <span class="english-name">{{ lang.code }}</span>
              <span class="genre-subtitle">{{ lang.subtitle }}</span>
            </div>
          </div>

        </button>
      </div>
    </div>

    <!-- Bottom Action Footer -->
    <div class="modal-footer">
      <button 
        type="button" 
        class="listen-now-btn" 
        [disabled]="selectedLanguages().length === 0" 
        (click)="confirmAndListen()">
        
        <div class="btn-content">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
          <span class="btn-text">Listen Now</span>
          <span class="btn-badge" *ngIf="selectedLanguages().length > 0">
            {{ selectedLanguages().length }} {{ selectedLanguages().length === 1 ? 'Language' : 'Languages' }}
          </span>
        </div>
        <div class="btn-shine"></div>
      </button>

      <p class="footer-hint" *ngIf="selectedLanguages().length === 0">
        ⚠️ Please select at least one language to continue
      </p>
    </div>

  </div>
</div>
