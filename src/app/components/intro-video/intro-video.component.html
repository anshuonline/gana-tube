@if (showOverlay()) {
  <div class="intro-overlay" [class.fading]="fadingOut()">
    <video
      #introVideo
      class="intro-video"
      [src]="videoSrc"
      autoplay
      muted
      playsinline
      preload="auto"
      (ended)="onVideoEnded()"
      (error)="onVideoEnded()">
    </video>

    <button class="skip-btn" (click)="skipIntro()">
      Skip
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="13 17 18 12 13 7"></polyline>
        <polyline points="8 17 13 12 8 7"></polyline>
      </svg>
    </button>
  </div>
}
