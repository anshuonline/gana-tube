@if (showOverlay()) {
  <div class="intro-overlay" [class.fading]="fadingOut()">
    <div class="ambient-glow glow-purple"></div>
    <div class="ambient-glow glow-pink"></div>

    <div class="intro-content" [class.visible]="!fadingOut()">
      <div class="logo-wrapper">
        <svg class="logo-icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="24" cy="24" r="22" stroke="url(#logoGrad)" stroke-width="2.5" fill="none"/>
          <path d="M19 16L33 24L19 32V16Z" fill="url(#logoGrad)"/>
          <defs>
            <linearGradient id="logoGrad" x1="0" y1="0" x2="48" y2="48">
              <stop offset="0%" stop-color="#a855f7"/>
              <stop offset="100%" stop-color="#ec4899"/>
            </linearGradient>
          </defs>
        </svg>
      </div>

      <h1 class="intro-title">
        <span class="gradient-text">ganatube</span><span class="dot">.in</span>
      </h1>

      <p class="intro-tagline">Free Music. No Ads. Ever.</p>
    </div>
  </div>
}
