@if (showOverlay()) {
  <div class="intro-overlay" [class.fading]="fadingOut()" (click)="skipIntro()">
    <div class="intro-content" [class.visible]="!fadingOut()">
      <div class="logo-wrapper">
        <div class="logo-glow" aria-hidden="true"></div>
        <svg
          class="logo-icon"
          viewBox="0 0 120 120"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          role="img"
          aria-label="GanaTube logo"
        >
          <defs>
            <linearGradient id="gtIntroGrad" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#a855f7" />
              <stop offset="1" stop-color="#ec4899" />
            </linearGradient>
          </defs>
          <rect class="wave wave-1" x="14" y="53" width="8" height="14" rx="4" fill="url(#gtIntroGrad)" />
          <rect class="wave wave-2" x="27" y="45" width="8" height="30" rx="4" fill="url(#gtIntroGrad)" />
          <rect class="wave wave-3" x="40" y="35" width="8" height="50" rx="4" fill="url(#gtIntroGrad)" />
          <path
            d="M60 36 C60 29 67 25 73 29 L101 51 C107 55.5 107 64.5 101 69 L73 91 C67 95 60 91 60 84 Z"
            fill="url(#gtIntroGrad)"
          />
        </svg>
      </div>
      <h1 class="intro-title">
        <span class="title-main">GanaTube</span><span class="title-domain">.in</span>
      </h1>
    </div>
  </div>
}
