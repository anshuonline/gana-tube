@if (showOverlay()) {
  <div class="intro-overlay" [class.fading]="fadingOut()" (click)="skipIntro()" aria-hidden="true">
    <div class="intro-brand">
      <img
        class="intro-logo"
        src="/ganatube-logo.webp"
        alt=""
        width="48"
        height="48"
        draggable="false"
        decoding="async"
      />
      <span class="intro-wordmark">GanaTube</span>
    </div>
    <div class="intro-progress-bar">
      <span class="intro-progress-fill"></span>
    </div>
  </div>
}
